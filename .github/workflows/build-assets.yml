name: Build AIProgramming Rich Asset Library

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'catalog/autodiscovery.json'
      - 'catalog/sources.json'
      - 'scripts/build_library.py'
      - 'scripts/build_library_large.py'
      - 'scripts/repair_catalog_ids.py'
      - 'scripts/verify_library.py'
      - 'scripts/verify_coverage.py'
      - '.github/workflows/build-assets.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build expanded library
        run: |
          python scripts/build_library_large.py \
            --output dist/aiprogramming-assets-v0.2

      - name: Normalize unique asset IDs
        run: |
          python scripts/repair_catalog_ids.py \
            dist/aiprogramming-assets-v0.2

      - name: Verify file integrity
        run: |
          python scripts/verify_library.py \
            dist/aiprogramming-assets-v0.2 \
            --min-assets 3000 \
            --min-size-mib 100

      - name: Verify richness and game coverage
        run: |
          python scripts/verify_coverage.py \
            dist/aiprogramming-assets-v0.2 \
            --min-assets 3000 \
            --min-packs 30 \
            --min-themes 8 \
            --min-kind-groups 4

      - name: Create release archive
        run: |
          python - <<'PY'
          import shutil
          shutil.make_archive(
              'dist/aiprogramming-assets-v0.2',
              'zip',
              root_dir='dist',
              base_dir='aiprogramming-assets-v0.2',
          )
          PY

      - name: Report archive size
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('dist/aiprogramming-assets-v0.2.zip')
          mib = p.stat().st_size / 1024 / 1024
          print(f'Final ZIP size: {mib:.1f} MiB')
          print('Size is informational; diversity/coverage are the release criteria.')
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aiprogramming-assets-v0.2
          path: dist/aiprogramming-assets-v0.2.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="assets-v0.2"
          FILE="dist/aiprogramming-assets-v0.2.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE#aiprogramming-assets-v0.2.zip" --clobber
          else
            gh release create "$TAG" "$FILE#aiprogramming-assets-v0.2.zip" \
              --title "AIProgramming Assets v0.2" \
              --notes "Curated CC0 runtime library for Godot/Web student projects. Release criteria focus on breadth: multiple themes, asset kinds, characters, environments, UI and audio."
          fi
