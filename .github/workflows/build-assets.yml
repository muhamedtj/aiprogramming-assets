name: Build AIProgramming Rich Asset Library

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'catalog/autodiscovery.json'
      - 'catalog/sources.json'
      - 'scripts/build_library.py'
      - 'scripts/build_library_large.py'
      - 'scripts/repair_catalog_ids.py'
      - 'scripts/package_release.py'
      - 'scripts/verify_library.py'
      - 'scripts/verify_coverage.py'
      - '.github/workflows/build-assets.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build expanded library
        run: |
          python scripts/build_library_large.py \
            --output dist/aiprogramming-assets-v0.2

      - name: Normalize unique asset IDs
        run: |
          python scripts/repair_catalog_ids.py \
            dist/aiprogramming-assets-v0.2

      - name: Verify file integrity
        run: |
          python scripts/verify_library.py \
            dist/aiprogramming-assets-v0.2 \
            --min-assets 3000 \
            --min-size-mib 100

      - name: Verify richness and game coverage
        run: |
          python scripts/verify_coverage.py \
            dist/aiprogramming-assets-v0.2 \
            --min-assets 3000 \
            --min-packs 30 \
            --min-themes 8 \
            --min-kind-groups 4

      - name: Build downloadable pack release
        run: |
          python scripts/package_release.py \
            dist/aiprogramming-assets-v0.2 \
            --output dist/release-assets

      - name: Create full backup archive
        run: |
          python - <<'PY'
          import shutil
          shutil.make_archive(
              'dist/aiprogramming-assets-v0.2',
              'zip',
              root_dir='dist',
              base_dir='aiprogramming-assets-v0.2',
          )
          PY

      - name: Report library statistics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          full = Path('dist/aiprogramming-assets-v0.2.zip')
          index = json.loads(Path('dist/release-assets/release-index.json').read_text())
          print(f"Assets: {index['asset_count']}")
          print(f"Downloadable packs: {index['pack_count']}")
          print(f"Full backup ZIP: {full.stat().st_size / 1024 / 1024:.1f} MiB")
          PY

      - name: Upload release bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: aiprogramming-assets-v0.2-release
          path: |
            dist/release-assets/
            dist/aiprogramming-assets-v0.2.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="assets-v0.2"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "AIProgramming Assets v0.2" \
              --notes "Curated CC0 runtime asset library for Godot/Web student projects. Use release-index.json to select only the packs needed by a project."
          fi

          gh release upload "$TAG" \
            "dist/release-assets/release-index.json" \
            "dist/release-assets/catalog.generated.json" \
            "dist/release-assets/PROVENANCE.json" \
            "dist/aiprogramming-assets-v0.2.zip#aiprogramming-assets-v0.2-full.zip" \
            --clobber

          # Upload each runtime pack and its compact catalog independently.
          find dist/release-assets -maxdepth 1 -type f \( -name '*.zip' -o -name '*.catalog.json' \) -print0 | \
          while IFS= read -r -d '' file; do
            echo "Uploading $(basename "$file")"
            gh release upload "$TAG" "$file" --clobber
          done
